services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  odoo:
    image: odoo:17.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
    volumes:
      - odoo_filestore:/var/lib/odoo
      - ./config/odoo.conf.tpl:/etc/odoo/odoo.conf.tpl:ro
      - ./config/init.sh:/init.sh:ro
      - ./custom-addons:/mnt/extra-addons
    entrypoint: ["/bin/bash", "/init.sh"]
    networks:
      - odoo_net

  seeder:
    image: python:3.11-slim
    volumes:
      - ./seed_data.py:/seed_data.py
      - .env:/.env
    environment:
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=farmacia_db
    networks:
      - odoo_net
    depends_on:
      odoo:
        condition: service_started
    command: ["python3", "/seed_data.py"]
    
  firmador:
    image: registry.fopinet.com/firmador-mh:latest
    container_name: svfe-api-firmador
    environment:
      TZ: America/El_Salvador
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-nonssl}
    working_dir: /app
    volumes:
      - ../files/uploads:/app/uploads
    restart: always

volumes:
  postgres_data:
  odoo_filestore:

networks:
  odoo_net:
    driver: bridge
